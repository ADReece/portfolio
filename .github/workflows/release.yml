name: Release

# Every merge into develop (the production branch) releases automatically:
# tests, then the image is built and pushed to GHCR as :prod, :<version> and
# :sha-<short>, then the version tag and GitHub release are created. The
# Hetzner server watches :prod and redeploys itself within about a minute,
# so this workflow never talks to the server.
#
# The version comes from .github/scripts/next-version.sh: patch by default,
# minor when a merged commit is "feat:", major on "BREAKING CHANGE" or "type!:".
# Tags made with GITHUB_TOKEN don't trigger workflows, so there's no loop.

on:
  push:
    branches: [develop]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/adreece/portfolio

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_mysql, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer validate --no-check-publish
      - name: PHP syntax check
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n 50 -P 4 php -l -n > /dev/null
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  image:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    # Pushing :prod deploys production. Add required reviewers to the
    # "production" environment (Settings → Environments) to approve each one.
    environment:
      name: production
      url: https://portfolio.ascend-digital.co.uk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the version
      - name: Work out the version
        id: version
        run: |
          { .github/scripts/next-version.sh "$GITHUB_SHA"; echo "short=${GITHUB_SHA::7}"; } | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/hetzner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Only after the image is pushed, so a failed build never gets a tag.
      - name: Tag the release
        if: steps.version.outputs.status == 'new'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Released $VERSION"
            echo "Image: \`${IMAGE}:prod\` = \`${IMAGE}:${VERSION}\` = \`${IMAGE}:sha-${{ steps.version.outputs.short }}\`"
            echo "Production redeploys within about a minute: https://portfolio.ascend-digital.co.uk/up"
          } >> "$GITHUB_STEP_SUMMARY"
