# Weekly dependency update PRs. Security alerts also need "Dependabot alerts"
# turned on in the repository settings (Settings → Code security).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns: ["laravel/*", "livewire/*"]
    ignore:
      # PHPUnit 13 needs PHP 8.4; the app, CI and images run PHP 8.3.
      # Remove this when moving to PHP 8.4.
      - dependency-name: phpunit/phpunit
        versions: [">=13"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /
      - /deploy/hetzner
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
