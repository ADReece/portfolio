[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:mariadb]
command = /usr/bin/mariadbd --user=mysql --datadir=/var/lib/mysql
priority = 10
autorestart = true
; During a deploy the previous container holds the data files for a while.
startsecs = 5
startretries = 1000
stopwaitsecs = 8
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:php-fpm]
command = /usr/sbin/php-fpm83 -F
priority = 20
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 30
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:db-setup]
command = /usr/local/bin/db-setup.sh
priority = 15
autorestart = unexpected
exitcodes = 0
startsecs = 0
startretries = 1000
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:queue]
command = /bin/sh -c 'until [ -f /run/portfolio-ready ]; do sleep 2; done; exec /usr/bin/php /var/www/html/artisan queue:work --queue=default,background --sleep=3 --tries=3 --max-time=3600'
user = nginx
priority = 40
autorestart = true
startsecs = 5
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
