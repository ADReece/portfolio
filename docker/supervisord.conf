[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

[program:mariadb]
command = /usr/bin/mariadbd --user=mysql --datadir=/var/lib/mysql
priority = 10
autorestart = true
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:php-fpm]
command = /usr/sbin/php-fpm83 -F
priority = 20
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 30
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:queue]
command = /usr/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user = nginx
priority = 40
autorestart = true
startsecs = 5
stopwaitsecs = 60
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
