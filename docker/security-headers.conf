# Security headers for every response, PHP and static alike. Included in each
# server block AND in any location that sets its own add_header, because a
# location's add_header replaces the server's. The CSP comes from Laravel
# (App\Http\Middleware\ContentSecurityPolicy) because it depends on config.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(self \"https://js.stripe.com\")" always;
