; Web role only: PHP-FPM and nginx in one container, as the "app" user.
[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = /usr/sbin/php-fpm83 -F
priority = 10
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
priority = 20
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
